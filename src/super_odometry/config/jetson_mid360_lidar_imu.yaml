/**:
  ros__parameters:
    # Livox ROS 2 driver with xfer_format=1 publishes CustomMsg, as required by
    # SuperOdom's native LiDAR+IMU feature extraction path.
    imu_topic: "/livox/imu"
    laser_topic: "/livox/lidar"
    sensor: "livox"
    use_imu_roll_pitch: false
    save_ply: false

    world_frame: "map"
    world_frame_rot: "map_rot"
    sensor_frame: "sensor"
    sensor_frame_rot: "sensor_rot"

    imu_acc_x_limit: 0.5
    imu_acc_y_limit: 0.2
    imu_acc_z_limit: 0.4

    feature_extraction_node:
      scan_line: 4
      min_range: 0.2
      filter_point_size: 3
      provide_point_time: 1
      use_imu_roll_pitch: false
      debug_view: false

    laser_mapping_node:
      mapping_line_resolution: 0.1
      mapping_plane_resolution: 0.1
      max_iterations: 3
      max_surface_features: 1600
      map_accumulation_max_linear_speed: 1.0
      map_accumulation_max_angular_speed: 1.5
      map_accumulation_max_registration_rmse: 0.08
      map_accumulation_min_correspondences: 500
      localization_mode: false
      read_pose_file: false
      init_x: 0.0
      init_y: 0.0
      init_z: 0.0
      init_roll: 0.0
      init_pitch: 0.0
      init_yaw: 0.0
      debug_view: false

    imu_preintegration_node:
      lidar_correction_noise: 0.01
      acc_n: 0.0039939570888238808
      gyr_n: 0.0015636343949698187
      acc_w: 0.00006435665935353257
      gyr_w: 0.00003564031869637613
      g_norm: 9.80511
      use_imu_roll_pitch: false
